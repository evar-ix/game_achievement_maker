services:
  postgres:
    image: postgres:17-alpine
    container_name: game-achievement-maker-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - achievement_maker_postgres_data:/var/lib/postgresql/data

volumes:
  achievement_maker_postgres_data:
